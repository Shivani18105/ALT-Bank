spring:
  application:
    name: alt-bank
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: alt-bank-pool
      # Each in-flight transaction holds exactly one connection, so the pool must be >= worker threads.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 5000      # ms to wait for a free connection before failing fast
      idle-timeout: 300000          # 5 min
      max-lifetime: 1500000         # 25 min (below typical server/proxy limits)
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # mass-assignment defence: unknown JSON fields are rejected
server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: alt-bank
altbank:
  jwt:
    secret: ${ALT_JWT_SECRET}        # >= 32 bytes, from the environment only
    issuer: alt-bank
    ttl-minutes: 30
  worker:
    pool-size: ${ALT_WORKER_POOL_SIZE:10}
    queue-capacity: 500
    request-timeout-seconds: 30
  rate-limit:
    login-per-minute: 10
    transactions-per-minute: 120
  cors:
    allowed-origins: ${ALT_CORS_ALLOWED_ORIGINS:}
  security:
    max-failed-logins: 5
    lock-minutes: 15
  money:
    max-amount: 10000000.00
  demo:
    enabled: false
