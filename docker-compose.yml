services:
  postgres:
    image: postgres:16-alpine
    container_name: alt-bank-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alt_bank}
      POSTGRES_USER: ${POSTGRES_USER:-altbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - alt-bank-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-altbank} -d ${POSTGRES_DB:-alt_bank}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  alt-bank-postgres-data:
